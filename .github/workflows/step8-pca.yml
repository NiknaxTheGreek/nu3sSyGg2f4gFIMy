name: Step 8 PCA

on:
  push:
    paths:
      - 'step8.py'
      - '.github/workflows/step8-pca.yml'

jobs:
  pca:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet numpy pandas scipy scikit-learn
      - name: Download official NLPL Model 40
        run: curl -L --fail --retry 5 --retry-delay 5 -o 40.zip https://vectors.nlpl.eu/repository/20/40.zip
      - name: Run exact Step 8 PCA
        run: python step8.py
      - name: Upload PCA outputs
        uses: actions/upload-artifact@v4
        with:
          name: step8-pca-results
          path: |
            step8_embeddings_100d.csv
            step8_pca_scores_all.csv
            step8_pca_scores_retained.csv
            step8_explained_variance.csv
            step8_summary.json
          retention-days: 1
