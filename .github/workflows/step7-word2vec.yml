name: Step 7 Word2Vec

on:
  push:
    paths:
      - 'step7.py'
      - 'step7_input.csv'
      - '.github/workflows/step7-word2vec.yml'

jobs:
  word2vec:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet numpy pandas scipy scikit-learn
      - name: Download official NLPL Model 40
        run: |
          curl -L --fail --retry 5 --retry-delay 5 -o 40.zip https://vectors.nlpl.eu/repository/20/40.zip
          ls -lh 40.zip
      - name: Run exact Step 7
        run: python step7.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: step7-word2vec-results
          path: step7_results.csv
          retention-days: 1
