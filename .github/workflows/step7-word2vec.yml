name: Step 7 Word2Vec

on:
  push:
    paths:
      - 'step7.py'
      - 'cache_embeddings.py'
      - 'step7_input.csv'
      - '.github/workflows/step7-word2vec.yml'

jobs:
  word2vec:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --quiet numpy pandas scipy scikit-learn
      - name: Download official NLPL Model 40
        run: |
          curl -L --fail --retry 5 --retry-delay 5 -o 40.zip https://vectors.nlpl.eu/repository/20/40.zip
          ls -lh 40.zip
      - name: Run exact Step 7 and preserve embeddings
        run: python cache_embeddings.py
      - name: Upload reusable Word2Vec outputs
        uses: actions/upload-artifact@v4
        with:
          name: model40-reusable-project-cache
          path: |
            step7_results.csv
            model40_candidate_embeddings_50x100.csv
            model40_candidate_embeddings_50x100.npy
            model40_query_embeddings_2x100.csv
            model40_required_token_vectors.csv
          retention-days: 7
